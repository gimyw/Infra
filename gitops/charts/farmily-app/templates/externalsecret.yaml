# 두 Secrets Manager 시크릿(app + app-infra)을 k8s Secret 한 개(app-secrets)로 병합
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .Values.eso.refreshInterval }}     # 주기적 재동기화
  secretStoreRef: { name: {{ .Values.eso.store }}, kind: SecretStore }
  target:
    name: app-secrets        # 생성될 k8s Secret 이름 (앱이 envFrom 으로 주입)
  dataFrom:
  {{- range .Values.eso.paths }}
    - extract: { key: {{ . }} }
  {{- end }}
