# 파드 묶는 진입점(ClusterIP). TargetGroupBinding 이 이 Service 의 엔드포인트를 TG 에 등록
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: {{ .Values.app.name }} }
  ports: [ { port: {{ .Values.app.port }}, targetPort: {{ .Values.app.port }}, appProtocol: http } ]
