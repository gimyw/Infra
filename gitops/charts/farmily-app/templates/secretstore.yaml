# AWS Secrets Manager 통로 — eso-reader SA 로 인증
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ .Values.eso.store }}
  namespace: {{ .Values.namespace }}
  annotations:
    # ESO CRD 가 아직 없을 때(콜드스타트) dry-run 검증 실패로 전체 sync 가 막히는 것 방지.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: eso-reader
