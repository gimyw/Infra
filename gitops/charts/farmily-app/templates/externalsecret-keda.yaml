{{- if .Values.keda.enabled }}
{{- $appPath := index .Values.eso.paths 0 }}        {{/* farmily/<env>/app */}}
{{- $infraPath := index .Values.eso.paths 1 }}      {{/* farmily/<env>/app-infra */}}
# KEDA(PostgreSQL 스케일러)가 쓸 PG 접속 문자열을 별도 k8s Secret 으로 생성
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keda-pg-conn
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .Values.eso.refreshInterval }}
  secretStoreRef: { name: {{ .Values.eso.store }}, kind: SecretStore }
  target:
    name: keda-pg-secret
    template:
      engineVersion: v2
      data:
        # {{ "{{ .host }}" }} 등은 ESO 자체 템플릿(런타임 치환) — Helm 이 건드리지 않게 escape
        connection: "host={{ "{{ .host }}" }} port={{ "{{ .port }}" }} dbname={{ "{{ .dbname }}" }} user={{ "{{ .user }}" }} password={{ "{{ .password }}" }} sslmode=require"
  data:
    - { secretKey: host,     remoteRef: { key: {{ $infraPath }}, property: DB_HOST } }
    - { secretKey: port,     remoteRef: { key: {{ $infraPath }}, property: DB_PORT } }
    - { secretKey: dbname,   remoteRef: { key: {{ $infraPath }}, property: DB_NAME } }
    - { secretKey: user,     remoteRef: { key: {{ $infraPath }}, property: DB_USER } }
    - { secretKey: password, remoteRef: { key: {{ $appPath }},   property: DB_PASSWORD } }
{{- end }}
