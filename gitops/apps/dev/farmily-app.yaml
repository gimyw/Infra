apiVersion: v1
kind: ServiceAccount
metadata:
  name: farmily-app
  namespace: farmily-dev
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::851957594139:role/dev-eks-app-role
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: farmily-app
  namespace: farmily-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: farmily-app
  template:
    metadata:
      labels:
        app: farmily-app
    spec:
      serviceAccountName: farmily-app
      containers:
        - name: farmily-app
          image: 851957594139.dkr.ecr.ap-northeast-2.amazonaws.com/farmily-api-dev:dev-f702539
          ports:
            - containerPort: 8080
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: "dev" }
            - { name: APP_VARIANT, value: "eks" }          # ★ 버전 마커
            - { name: AWS_REGION, value: "ap-northeast-2" }
            - { name: S3_REGION, value: "ap-northeast-2" }
            - { name: KAKAO_CLIENT_ID, value: "22fb8cb7a66c952ac7b68d8f02662fab" }
            - { name: KAKAO_REDIRECT_URI, value: "http://localhost:3000/oauth/kakao" }
            - { name: PORTONE_IMP_CODE, value: "imp60055885" }
            - { name: PORTONE_TEST_MODE, value: "true" }
            - { name: AUTH_DEV_MASTER_ENABLED, value: "true" }
          envFrom:
            - secretRef:
                name: app-secrets
          readinessProbe:
            httpGet:
              path:
                /api/v1/health
              port:
                8080
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: 
                /api/v1/health
              port:
                8080
            initialDelaySeconds: 90
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: farmily-app
  namespace: farmily-dev
spec:
  selector: { app: farmily-app }
  ports: [ { port: 8080, targetPort: 8080 } ]
    