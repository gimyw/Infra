# Grafana 데이터소스 — kube-prometheus-stack 의 grafana 사이드카가 라벨로 자동 발견.
# (sidecar.datasources.enabled=true 기본값, searchNamespace=release ns=monitoring)
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  tempo.yaml: |
    apiVersion: 1
    datasources:
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo.monitoring.svc:3200   # Tempo 쿼리 API 포트
        jsonData:
          # Prometheus 와 연동(서비스 그래프/메트릭 점프)
          serviceMap:
            datasourceUid: prometheus
