apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-envoy-stats
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchExpressions:
      - key: istio-prometheus-ignore
        operator: DoesNotExist
  namespaceSelector:
    any: true
  podMetricsEndpoints:
    - path: /stats/prometheus
      interval: 15s
      relabelings:
        - { action: keep, sourceLabels: [__meta_kubernetes_pod_container_name], regex: "istio-proxy" }
        - { action: keep, sourceLabels: [__meta_kubernetes_pod_annotationpresent_prometheus_io_scrape] }
        - action: replace
          regex: (\d+);((([0-9]+?)(\.|$)){4})
          replacement: $2:$1
          sourceLabels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_ip]
          targetLabel: __address__
        - { action: labeldrop, regex: "__meta_kubernetes_pod_label_(.+)" }
        - { action: replace, sourceLabels: [__meta_kubernetes_namespace], targetLabel: namespace }
        - { action: replace, sourceLabels: [__meta_kubernetes_pod_name], targetLabel: pod_name }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: istiod-monitor
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels: { istio: pilot }      # istiod 서비스 라벨(확인됨)
  namespaceSelector: { any: true }
  endpoints:
    - port: http-monitoring            # istiod 포트 15014(확인됨)
      interval: 15s