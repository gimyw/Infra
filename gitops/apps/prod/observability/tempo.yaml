apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: 1.24.4        # 단일 바이너리 Tempo (이 규모엔 충분)
    helm:
      values: |
        tempo:
          # 트레이스 저장 = S3 (IRSA prod-eks-tempo-role, static key 없음)
          storage:
            trace:
              backend: s3
              s3:
                bucket: farmily-tempo-traces
                endpoint: s3.ap-northeast-2.amazonaws.com
                region: ap-northeast-2
          retention: 72h
          # OTLP 수신 — 앱(OTel)이 직접 보냄. gRPC 4317 / HTTP 4318
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
          reportingEnabled: false
        # IRSA — S3 접근. SA 이름을 'tempo'로 고정(IRSA trust 의 sub 와 일치)
        serviceAccount:
          create: true
          name: tempo
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::851957594139:role/prod-eks-tempo-role
        # S3 백엔드라 로컬 영속 불필요(WAL 은 emptyDir)
        persistence:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
