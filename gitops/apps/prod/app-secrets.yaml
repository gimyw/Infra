# 앱 네임스페이스
apiVersion: v1
kind: Namespace
metadata: { name: farmily-prod }
---
# ESO가 Secrets Manager를 읽을 때 쓸 Service Account (IRSA)
# 이 SA를 AWS에 연결함 (prod-eks-eso-reader-role)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-reader
  namespace: farmily-prod
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::851957594139:role/prod-eks-eso-reader-role
---
# AWS Secrets Manager 통로(SecretStore) — eso-reader SA로 인증
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-sm
  namespace: farmily-prod
  annotations:
    # ESO CRD가 아직 없을 때(콜드스타트) dry-run 검증 실패로 전체 sync가 막히는 것 방지.
    # ESO Application 이 설치되어 CRD 생긴 뒤 selfHeal 로 적용됨.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      auth:
        jwt:
          serviceAccountRef:
            name: eso-reader
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: farmily-prod
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # 1시간 마다 재동기화
  refreshInterval: 1h
  secretStoreRef: { name: aws-sm, kind: SecretStore }
  target:
    # farmily/prod/app + farmily/prod/app-infra 의 모든 키를 app-secrets k8s secret 으로 병합
    name: app-secrets
  dataFrom:
    - extract: { key: farmily/prod/app }       # 진짜 시크릿(외부 관리)
    - extract: { key: farmily/prod/app-infra }  # 인프라값(DB_URL·REDIS_HOST 등, Terraform 생성)
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keda-pg-conn
  namespace: farmily-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-sm
    kind: SecretStore
  target:
    name: keda-pg-secret
    template: 
      engineVersion: v2
      data:
        connection: "host={{ .host }} port={{ .port }} dbname={{ .dbname }} user={{ .user }} password={{ .password }} sslmode=require"
  data:
    - { secretKey: host,     remoteRef: { key: farmily/prod/app,       property: DB_HOST } }
    - { secretKey: port,     remoteRef: { key: farmily/prod/app-infra,  property: DB_PORT } }
    - { secretKey: dbname,   remoteRef: { key: farmily/prod/app-infra,  property: DB_NAME } }
    - { secretKey: user,     remoteRef: { key: farmily/prod/app,       property: DB_USER } }
    - { secretKey: password, remoteRef: { key: farmily/prod/app,       property: DB_PASSWORD } }