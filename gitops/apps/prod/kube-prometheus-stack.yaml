apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 86.3.2
    helm:
      values: |
        grafana:
          enabled: true
        prometheus:
          prometheusSpec:
            # 메트릭 보관 기간. 15일치 보관 후 자동 삭제
            retention: 15d   
        alertmanager:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # 거대 CRD(prometheuses 등)의 last-applied-configuration이 262144B 한계를 넘어 sync 실패 → 서버사이드 어플라이로 회피
      - ServerSideApply=true
      # CRD가 같은 차트에서 늦게 깔릴 때 CR dry-run으로 전체 sync 막히지 않게
      - SkipDryRunOnMissingResource=true