apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: public.ecr.aws/karpenter
    chart: karpenter
    targetRevision: "1.13.0"
    helm:
      values: |
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::851957594139:role/prod-eks-karpenter-role
        settings:
          clusterName: prod-eks
          interruptionQueue: prod-eks-karpenter-interruption
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                  - key: eks.amazonaws.com/nodegroup
                    operator: In
                    values: ["prod-eks-ng"]
        # karpenter_*(노드 프로비저닝·노드클레임) 메트릭 ServiceMonitor 생성. release 라벨로 선택되게 함.
        serviceMonitor:
          enabled: true
          additionalLabels:
            release: kube-prometheus-stack

  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true