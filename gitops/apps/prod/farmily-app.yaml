apiVersion: v1
kind: ServiceAccount
metadata:
  name: farmily-app
  namespace: farmily-prod
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::851957594139:role/prod-eks-app-role
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: farmily-app
  namespace: farmily-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: farmily-app
  template:
    metadata:
      labels:
        app: farmily-app
    spec:
      serviceAccountName: farmily-app
      containers:
        - name: farmily-app
          # prod ECR 이미지 — 불변 SHA 태그로 핀(롤백 추적·재시작 시 버전 고정). latest 금지.
          # 새 배포 = 이 태그를 새 prod-<sha>로 갱신(이상적으로 CI/CD가 자동 커밋).
          image: 851957594139.dkr.ecr.ap-northeast-2.amazonaws.com/farmily-api:prod-d7b6cd9
          ports:
            - containerPort: 8080
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: "prod" }
            - { name: APP_VARIANT, value: "eks" }          # ★ 버전 마커(ECS vs EKS 식별)
            - { name: S3_REGION, value: "ap-northeast-2" }
            - { name: AGENTCORE_URL, value: "http://farmily-app-ai:8080" }
            - { name: AUTH_DEV_MASTER_ENABLED, value: "true"}
          envFrom:
            - secretRef:
                name: app-secrets   # ESO 가 farmily/prod/app + app-infra 병합 생성
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: farmily-app
  namespace: farmily-prod
spec:
  selector: { app: farmily-app }
  ports: [ { port: 8080, targetPort: 8080 } ]
