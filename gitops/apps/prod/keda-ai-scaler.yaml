apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-pg-auth
  namespace: farmily-prod
  annotations:
    # KEDA CRD가 차트보다 늦게 깔려도 dry-run으로 전체 sync가 막히지 않게 (§8 데드락 회피)
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretTargetRef:
    - { parameter: connection, name: keda-pg-secret, key: connection}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: farmily-app-ai
  namespace: farmily-prod
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  scaleTargetRef:
    name: farmily-app-ai # 이 디플로이먼트에서
  minReplicaCount: 2 # 최소 2개 
  maxReplicaCount: 5 # 최대 5개
  pollingInterval: 15 # 15초마다 큐 깊이를 확인함
  cooldownPeriod: 300 # 마지막 부하 후 5분 뒤 축소한다.
  triggers:
    - type: postgresql
      metadata:
        query: "SELECT count(*) FROM content_jobs WHERE status IN ('QUEUED','ANALYZING','ENRICHING','GENERATING')"
        targetQueryValue: "3"
      authenticationRef:
        name: keda-pg-auth
        